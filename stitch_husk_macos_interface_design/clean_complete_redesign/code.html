<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Husk - Clean Complete</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-lowest": "#0e0e0f",
                        "on-secondary": "#003735",
                        "on-background": "#e5e2e3",
                        "on-tertiary-fixed": "#002118",
                        "surface-container-low": "#1b1b1c",
                        "tertiary-fixed": "#bbedda",
                        "tertiary": "#a6d8c5",
                        "on-secondary-fixed": "#00201f",
                        "on-primary-fixed": "#2c1600",
                        "on-error-container": "#ffdad6",
                        "surface-container": "#1f1f20",
                        "outline": "#9e8e7f",
                        "error-container": "#93000a",
                        "surface": "#131314",
                        "surface-dim": "#131314",
                        "on-primary-container": "#663a00",
                        "inverse-on-surface": "#303031",
                        "secondary-container": "#007d7a",
                        "on-secondary-container": "#c6fffb",
                        "inverse-primary": "#87520f",
                        "primary-fixed": "#ffdcbd",
                        "error": "#ffb4ab",
                        "inverse-surface": "#e5e2e3",
                        "secondary": "#77d6d2",
                        "outline-variant": "#514439",
                        "on-primary-fixed-variant": "#693c00",
                        "on-tertiary-container": "#1c4c3e",
                        "on-tertiary": "#01382b",
                        "on-error": "#690005",
                        "primary-container": "#e8a45c",
                        "on-primary": "#492900",
                        "secondary-fixed": "#94f3ee",
                        "tertiary-container": "#8bbcaa",
                        "surface-container-high": "#2a2a2b",
                        "primary-fixed-dim": "#ffb86e",
                        "primary": "#ffc284",
                        "surface-tint": "#ffb86e",
                        "surface-variant": "#353436",
                        "on-tertiary-fixed-variant": "#1f4f41",
                        "on-surface": "#e5e2e3",
                        "secondary-fixed-dim": "#77d6d2",
                        "surface-container-highest": "#353436",
                        "on-surface-variant": "#d6c3b3",
                        "on-secondary-fixed-variant": "#00504d",
                        "background": "#131314",
                        "surface-bright": "#39393a",
                        "tertiary-fixed-dim": "#9fd1be"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter-md": "16px",
                        "container-padding": "24px",
                        "card-gap": "12px",
                        "rail-width": "64px"
                    },
                    "fontFamily": {
                        "label-caps": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "data-mono": ["JetBrains Mono"]
                    },
                    "fontSize": {
                        "label-caps": ["11px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-lg": ["28px", { "lineHeight": "34px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "data-mono": ["13px", { "lineHeight": "16px", "letterSpacing": "-0.01em", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Soft Emerald Radial Gradient Floor */
        body {
            background-color: theme('colors.surface-container-lowest');
            background-image: radial-gradient(circle at center, rgba(166, 216, 197, 0.1) 0%, transparent 70%);
            background-attachment: fixed;
        }

        /* Glassmorphism Classes */
        .glass-panel {
            background: rgba(42, 42, 43, 0.4);
            backdrop-filter: blur(30px) saturate(150%);
            -webkit-backdrop-filter: blur(30px) saturate(150%);
            border: 1px solid transparent;
            background-image: linear-gradient(rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0)), 
                              linear-gradient(rgba(42, 42, 43, 0.4), rgba(42, 42, 43, 0.4));
            background-origin: border-box;
            background-clip: padding-box, border-box;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }
        
        .glass-bubble {
             background: rgba(166, 216, 197, 0.15);
             backdrop-filter: blur(20px);
             -webkit-backdrop-filter: blur(20px);
             border: 1px solid rgba(166, 216, 197, 0.3);
             box-shadow: inset 0 2px 10px rgba(166, 216, 197, 0.2), 0 0 40px rgba(166, 216, 197, 0.1);
        }
        
        /* Zebra striping for cards if needed */
        .glass-panel-hover:hover {
            background-color: rgba(255, 255, 255, 0.02);
            transition: background-color 0.2s ease;
        }
    </style>
</head>
<body class="text-on-surface min-h-screen overflow-hidden flex selection:bg-tertiary selection:text-on-tertiary">
<!-- Active intent is linear/success screen, but prompt requests narrow left rail.
         Applying SideNavBar semantic shell but rendering it in a non-interactive/dimmed state for context -->
<nav class="fixed left-0 top-0 h-full w-rail-width bg-surface-container-lowest/50 dark:bg-surface-container-lowest/50 backdrop-blur-2xl border-r border-white/5 flex flex-col items-center py-6 gap-8 z-50">
<!-- Logo / Top Space -->
<div class="h-10 w-10 flex items-center justify-center rounded-lg bg-surface-container-high/50 text-on-surface">
<span class="material-symbols-outlined" data-icon="grid_view" data-weight="fill" style="font-variation-settings: 'FILL' 1;">grid_view</span>
</div>
<!-- Icons Cluster - All dimmed since we are in a success state -->
<div class="flex flex-col gap-6 w-full items-center mt-4">
<div class="text-on-surface-variant/40 p-2 flex flex-col items-center gap-1 group">
<span class="material-symbols-outlined" data-icon="space_dashboard">space_dashboard</span>
</div>
<div class="text-on-surface-variant/40 p-2 flex flex-col items-center gap-1 group">
<span class="material-symbols-outlined" data-icon="layers">layers</span>
</div>
<div class="text-on-surface-variant/40 p-2 flex flex-col items-center gap-1 group">
<span class="material-symbols-outlined" data-icon="terminal">terminal</span>
</div>
<div class="text-on-surface-variant/40 p-2 flex flex-col items-center gap-1 group">
<span class="material-symbols-outlined" data-icon="inventory_2">inventory_2</span>
</div>
<div class="text-on-surface-variant/40 p-2 flex flex-col items-center gap-1 group">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</div>
</div>
<div class="mt-auto flex flex-col gap-6 w-full items-center mb-4">
<div class="text-on-surface-variant/40 p-2 flex flex-col items-center gap-1 group">
<span class="material-symbols-outlined" data-icon="help">help</span>
</div>
<div class="text-on-surface-variant/40 p-2 flex flex-col items-center gap-1 group">
<span class="material-symbols-outlined" data-icon="info">info</span>
</div>
</div>
</nav>
<!-- Main Canvas -->
<main class="ml-rail-width w-full h-screen p-container-padding flex items-center justify-center relative z-10">
<!-- Central Success Container -->
<div class="max-w-2xl w-full flex flex-col items-center text-center">
<!-- Emerald Glass Bubble -->
<div class="glass-bubble w-32 h-32 rounded-full flex items-center justify-center mb-8 relative">
<!-- Inner glow -->
<div class="absolute inset-0 rounded-full bg-gradient-to-tr from-tertiary/20 to-transparent"></div>
<span class="material-symbols-outlined text-tertiary text-6xl drop-shadow-[0_0_15px_rgba(166,216,197,0.5)] z-10" data-icon="check_circle" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<!-- Typography -->
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-4">Peeled 32.6 GB</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-md mb-12">
                Regenerable files moved to Trash. Your project structures remain intact.
            </p>
<!-- Summary Cards Bento Layout -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-card-gap w-full mb-12">
<!-- System Caches -->
<div class="glass-panel rounded-xl p-5 flex flex-col items-start text-left glass-panel-hover">
<div class="flex items-center gap-2 mb-3">
<span class="material-symbols-outlined text-tertiary text-lg" data-icon="memory">memory</span>
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">System Caches</span>
</div>
<div class="font-data-mono text-data-mono text-on-surface text-lg mt-auto">12.4 GB</div>
</div>
<!-- Build Artifacts -->
<div class="glass-panel rounded-xl p-5 flex flex-col items-start text-left glass-panel-hover">
<div class="flex items-center gap-2 mb-3">
<span class="material-symbols-outlined text-tertiary text-lg" data-icon="build">build</span>
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">Build Artifacts</span>
</div>
<div class="font-data-mono text-data-mono text-on-surface text-lg mt-auto">18.2 GB</div>
</div>
<!-- Log Files -->
<div class="glass-panel rounded-xl p-5 flex flex-col items-start text-left glass-panel-hover">
<div class="flex items-center gap-2 mb-3">
<span class="material-symbols-outlined text-tertiary text-lg" data-icon="description">description</span>
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">Log Files</span>
</div>
<div class="font-data-mono text-data-mono text-on-surface text-lg mt-auto">2.0 GB</div>
</div>
</div>
<!-- Actions -->
<div class="flex gap-4 items-center">
<button class="px-6 py-3 rounded-full font-headline-md text-[15px] font-semibold text-on-surface-variant bg-white/5 hover:bg-white/10 border border-white/10 transition-colors">
                    View Log
                </button>
<button class="px-8 py-3 rounded-full font-headline-md text-[15px] font-semibold text-on-tertiary bg-tertiary hover:bg-tertiary-fixed transition-colors shadow-[0_4px_20px_rgba(166,216,197,0.2)]">
                    Done
                </button>
</div>
</div>
</main>
</body></html>
