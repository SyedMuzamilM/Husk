        }
    }catch(_e){}</script></head><body class="bg-background text-on-surface min-h-screen overflow-hidden selection:bg-primary/30">
<!-- Background Atmospheric Layers -->
<div class="fixed inset-0 pointer-events-none">
<div class="absolute inset-0 husk-glow"></div>
<div class="absolute inset-0 emerald-haze"></div>

</div>
<!-- Side Navigation Rail -->
<nav class="w-rail-width h-screen fixed left-0 top-0 bg-surface/60 backdrop-blur-3xl border-r border-white/10 flex flex-col items-center py-gutter-md gap-6 z-50">
<div class="font-headline-lg text-headline-lg text-primary mb-4">H</div>
<div class="flex flex-col gap-4 w-full items-center">
<button class="bg-primary-container/20 text-primary rounded-full p-2 scale-95 active:scale-90 transition-all hover:bg-white/5" title="Clean">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">mop</span>
</button>
<button class="text-on-surface-variant p-2 scale-95 active:scale-90 transition-all hover:bg-white/5" title="Analyze">
<span class="material-symbols-outlined">analytics</span>
</button>
<button class="text-on-surface-variant p-2 scale-95 active:scale-90 transition-all hover:bg-white/5" title="Apps">
<span class="material-symbols-outlined">apps</span>
</button>
<button class="text-on-surface-variant p-2 scale-95 active:scale-90 transition-all hover:bg-white/5" title="Status">
<span class="material-symbols-outlined">speed</span>
</button>
<button class="text-on-surface-variant p-2 scale-95 active:scale-90 transition-all hover:bg-white/5" title="Optimize">
<span class="material-symbols-outlined">bolt</span>
</button>
</div>
<div class="mt-auto">
<button class="text-on-surface-variant p-2 scale-95 active:scale-90 transition-all hover:bg-white/5" title="Settings">
<span class="material-symbols-outlined">settings</span>
</button>
</div>
</nav>
<!-- Top App Bar -->
<header class="w-full h-12 fixed top-0 left-0 pl-rail-width bg-transparent flex justify-between items-center px-container-padding z-40">
<div class="font-headline-md text-headline-md text-on-surface">Husk</div>
<div class="flex items-center gap-4">
<button class="text-on-surface-variant hover:text-primary transition-colors cursor-default">
<span class="material-symbols-outlined">fullscreen</span>
</button>
<button class="text-on-surface-variant hover:text-primary transition-colors cursor-default">
<span class="material-symbols-outlined">remove</span>
</button>
<button class="text-on-surface-variant hover:text-primary transition-colors cursor-default">
<span class="material-symbols-outlined">close</span>
</button>
</div>
</header>
<!-- Main Canvas Content -->
<main class="pl-rail-width pt-12 h-screen w-full relative flex flex-col items-center justify-center">
<div class="max-w-3xl w-full px-container-padding text-center space-y-12">
<!-- Hero Asset Section -->
<div class="relative flex justify-center py-8">
<div class="absolute w-64 h-64 bg-secondary/10 blur-[100px] rounded-full"></div>
<div class="seed-float relative z-10 w-48 h-48 flex items-center justify-center">
<!-- Glass Seed Icon Representation -->
<div class="relative">
<div class="w-32 h-44 bg-gradient-to-tr from-secondary/40 to-white/10 rounded-[60%_40%_50%_50%/70%_70%_30%_30%] border-[0.5px] border-white/20 backdrop-blur-xl shadow-2xl overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-b from-white/20 to-transparent"></div>
<!-- Core "Light" -->
<div class="absolute bottom-10 left-1/2 -translate-x-1/2 w-16 h-16 bg-primary/40 blur-xl rounded-full"></div>
</div>
<!-- Refraction Detail -->
<div class="absolute top-4 left-4 w-6 h-12 bg-white/30 blur-md rounded-full rotate-45"></div>
</div>
</div>
</div>
<!-- Typography Content -->
<div class="space-y-4">
<h1 class="font-headline-lg text-headline-lg tracking-tight text-white animate-in fade-in slide-in-from-bottom-4 duration-700">
                    Peeled 32.6 GB
                </h1>
<p class="font-body-md text-on-surface-variant max-w-md mx-auto leading-relaxed animate-in fade-in slide-in-from-bottom-6 duration-1000">
                    Regenerable files moved to Trash. Your project structures remain intact.
                </p>
</div>
<!-- Bento Status Grid (Secondary Info) -->
<div class="grid grid-cols-3 gap-card-gap animate-in fade-in slide-in-from-bottom-8 duration-1000 delay-200">
<div class="glass-card p-4 rounded-xl flex flex-col items-center gap-1 group hover:bg-white/5 transition-colors">
<span class="text-secondary font-label-caps uppercase opacity-60">System Caches</span>
<span class="font-data-mono text-white">12.4 GB</span>
</div>
<div class="glass-card p-4 rounded-xl flex flex-col items-center gap-1 group hover:bg-white/5 transition-colors">
<span class="text-secondary font-label-caps uppercase opacity-60">Build Artifacts</span>
<span class="font-data-mono text-white">18.2 GB</span>
</div>
<div class="glass-card p-4 rounded-xl flex flex-col items-center gap-1 group hover:bg-white/5 transition-colors">
<span class="text-secondary font-label-caps uppercase opacity-60">Log Files</span>
<span class="font-data-mono text-white">2.0 GB</span>
</div>
</div>
<!-- Call to Action -->
<div class="flex items-center justify-center gap-4 pt-4 animate-in fade-in slide-in-from-bottom-10 duration-1000 delay-300">
<button class="px-8 h-12 rounded-full glass-card hover:bg-white/10 text-on-surface font-label-caps transition-all active:scale-95 flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">list_alt</span>
                    View Log
                </button>
<button class="px-10 h-12 rounded-full bg-primary-container text-on-primary-container font-label-caps font-bold shadow-lg shadow-primary-container/20 hover:scale-105 active:scale-95 transition-all flex items-center gap-2">
                    Done
                </button>
</div>
</div>
</main>
<!-- Aesthetic Decorative Elements -->
<div class="fixed bottom-12 right-12 opacity-30 pointer-events-none">
<div class="glass-card px-4 py-2 rounded-full flex items-center gap-2">
<div class="w-1.5 h-1.5 bg-secondary rounded-full animate-pulse"></div>
<span class="font-data-mono text-[10px] tracking-widest uppercase">System Core Protected</span>
</div>
</div>
<script>
        // Simple entry animation sequencer
        document.addEventListener('DOMContentLoaded', () => {
            const elements = document.querySelectorAll('.animate-in');
            elements.forEach((el, index) => {
                el.style.opacity = '0';
                setTimeout(() => {
                    el.classList.add('opacity-100');
                    el.style.opacity = '1';
                }, 100 * index);
            });
        });

        // Interactive mouse parallax for the seed
        document.addEventListener('mousemove', (e) => {
            const seed = document.querySelector('.seed-float');
            const xAxis = (window.innerWidth / 2 - e.pageX) / 40;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 40;
            seed.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });
    </script>
</body></html>
